services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: respinet-backend
    ports:
      - "5000:5000"
    environment:
      - RESPINET_HOST=0.0.0.0
      - RESPINET_PORT=5000
    volumes:
      - ./backend/dataset:/app/dataset:Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: respinet-frontend
    ports:
      - "80:80"
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
