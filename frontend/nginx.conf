server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Single Page Application routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy to Flask Backend Service
    location /health {
        proxy_pass http://backend:5000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /predict {
        proxy_pass http://backend:5000/predict;
        proxy_read_timeout 130s;  # the client waits 120 s; nginx's default 60 s would turn slow inference into a 504
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 25M;
    }

    location /predict-sample/ {
        proxy_pass http://backend:5000/predict-sample/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # exact match: a prefix location would also capture the app's own /explainability page
    location = /explain {
        proxy_pass http://backend:5000/explain;
        proxy_read_timeout 130s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 25M;
    }

    location /summarize {
        proxy_pass http://backend:5000/summarize;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
